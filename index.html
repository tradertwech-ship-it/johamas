<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
        // Initialize Supabase Client with your project credentials
        const SUPABASE_URL = 'https://cdqgpuqboxtyafzltuxl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BWD9PZEDM0lj5NmwFEV0jQ_paA1X29C';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Live Application State (Synced with Supabase)
        let state = {
            activeRole: 'customer',
            isVendorLoggedIn: false,
            isAdminLoggedIn: false,
            adminPermanentPassword: '008145337',
            authMode: 'signin',
            currentVendor: null,
            selectedProduct: null,
            markupData: {
                lastResetDate: new Date().toDateString(),
                totalMarkup: 0
            },
            registeredVendors: [],
            products: [],
            orders: []
        };

        // 1. FETCH ALL DATA FROM SUPABASE ON STARTUP
        async function fetchAllDataFromCloud() {
            try {
                let { data: prodData } = await _supabase.from('products').select('*');
                let { data: ordData } = await _supabase.from('orders').select('*');
                let { data: vendData } = await _supabase.from('vendors').select('*');
                let { data: stateData } = await _supabase.from('system_state').select('*').eq('id', 'global').single();

                if (prodData) state.products = prodData;
                if (ordData) state.orders = ordData;
                if (vendData) state.registeredVendors = vendData;
                
                if (stateData) {
                    state.markupData.totalMarkup = parseFloat(stateData.totalMarkup) || 0;
                    state.markupData.lastResetDate = stateData.lastResetDate || new Date().toDateString();
                } else {
                    await _supabase.from('system_state').upsert({ id: 'global', totalMarkup: 0, lastResetDate: new Date().toDateString() });
                }
            } catch (err) {
                console.error("Error fetching cloud data:", err);
            }
            checkDailyMarkupReset();
            renderApp();
        }

        // 2. LISTEN FOR REALTIME CHANGES ACROSS ALL DEVICES
        function setupRealtimeSync() {
            _supabase.channel('public-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public' }, payload => {
                    fetchAllDataFromCloud();
                })
                .subscribe();
        }

        // Check & Execute Daily Reset of Net Markup Earnings
        async function checkDailyMarkupReset() {
            const currentDateStr = new Date().toDateString();
            if (state.markupData.lastResetDate !== currentDateStr) {
                state.markupData.totalMarkup = 0;
                state.markupData.lastResetDate = currentDateStr;
                await _supabase.from('system_state').upsert({ id: 'global', totalMarkup: 0, lastResetDate: currentDateStr });
            }
        }

        // Automated Tiered Pricing Engine
        function calculatePricing(basePriceInput) {
            const basePrice = parseFloat(basePriceInput) || 0;
            let markup = 0;

            if (basePrice >= 1000 && basePrice <= 9999) markup = 500;
            else if (basePrice >= 10000 && basePrice <= 49999) markup = 2500;
            else if (basePrice >= 50000 && basePrice <= 99999) markup = 5000;
            else if (basePrice >= 100000 && basePrice <= 999999) markup = 50000;
            else if (basePrice >= 1000000 && basePrice <= 10000000) markup = 100000;
            else if (basePrice >= 11000000) markup = 200000;

            return { basePrice, markup, customerPrice: basePrice + markup };
        }

        // Switch App Views/Roles
        function switchRole(role) {
            state.activeRole = role;
            ['customer', 'vendor', 'admin'].forEach(r => {
                document.getElementById(`view-${r}`).classList.add('hidden');
                document.getElementById(`nav-${r}`).className = "px-4 py-1.5 rounded-md transition text-slate-300 hover:text-white cursor-pointer";
            });
            document.getElementById(`view-${role}`).classList.remove('hidden');
            document.getElementById(`nav-${role}`).className = "px-4 py-1.5 rounded-md transition bg-amber-500 text-slate-950 font-bold cursor-pointer";
            renderApp();
        }

        function togglePasswordVisibility(inputId, btnId) {
            const pwdInput = document.getElementById(inputId);
            const eyeBtn = document.getElementById(btnId);
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeBtn.innerText = '🔒';
            } else {
                pwdInput.type = 'password';
                eyeBtn.innerText = '👁';
            }
        }

        function toggleAuthMode() {
            state.authMode = state.authMode === 'signin' ? 'signup' : 'signin';
            const nameContainer = document.getElementById('field-name-container');
            const passwordHint = document.getElementById('password-hint');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toggleText = document.getElementById('auth-toggle-text');
            const toggleBtn = document.getElementById('auth-toggle-btn');

            if (state.authMode === 'signup') {
                nameContainer.classList.remove('hidden');
                passwordHint.classList.remove('hidden');
                title.innerText = 'Vendor Sign Up';
                subtitle.innerText = 'Create your secure vendor account to start selling.';
                submitBtn.innerText = 'Register Vendor Account';
                toggleText.innerText = 'Already have a vendor account?';
                toggleBtn.innerText = 'Sign In';
            } else {
                nameContainer.classList.add('hidden');
                passwordHint.classList.add('hidden');
                title.innerText = 'Vendor Sign In';
                subtitle.innerText = 'Manage your shop, upload products, and track sales.';
                submitBtn.innerText = 'Sign In to Portal';
                toggleText.innerText = "Don't have a vendor account?";
                toggleBtn.innerText = 'Sign Up';
            }
        }

        function isStrongPassword(password) {
            return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}$/.test(password);
        }

        async function handleVendorAuthSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('auth-phone').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const name = document.getElementById('auth-name').value.trim();

            if (state.authMode === 'signup') {
                if (!name) { alert('Please provide your name or business name.'); return; }
                if (!isStrongPassword(password)) { alert('Password must be 8+ chars with uppercase, lowercase & number.'); return; }
                
                const existing = state.registeredVendors.find(v => v.phone === phone);
                if (existing) { alert('A vendor with this phone number already exists.'); return; }

                const newVendor = { phone, password, name };
                await _supabase.from('vendors').insert([newVendor]);
                state.currentVendor = newVendor;
                state.isVendorLoggedIn = true;
                alert('Secure vendor account successfully created!');
            } else {
                const vendor = state.registeredVendors.find(v => v.phone === phone && v.password === password);
                if (!vendor) { alert('Invalid phone number or password.'); return; }
                state.currentVendor = vendor;
                state.isVendorLoggedIn = true;
            }

            document.getElementById('vendor-auth-form').reset();
            renderApp();
        }

        function vendorLogout() {
            state.isVendorLoggedIn = false;
            state.currentVendor = null;
            renderApp();
        }

        async function deleteVendorAccount() {
            if (!state.currentVendor) return;
            if (confirm(`Permanently delete account (${state.currentVendor.name})?`)) {
                const vName = state.currentVendor.name;
                const vPhone = state.currentVendor.phone;
                
                await _supabase.from('vendors').delete().eq('phone', vPhone);
                await _supabase.from('products').delete().eq('vendorName', vName);
                
                state.isVendorLoggedIn = false;
                state.currentVendor = null;
                alert('Account deleted.');
                fetchAllDataFromCloud();
            }
        }

        async function deleteVendorProduct(productId) {
            if (confirm('Remove product from sale?')) {
                await _supabase.from('products').delete().eq('id', productId);
                fetchAllDataFromCloud();
            }
        }

        function handleAdminAuthSubmit(e) {
            e.preventDefault();
            if (document.getElementById('admin-auth-password').value.trim() === state.adminPermanentPassword) {
                state.isAdminLoggedIn = true;
                document.getElementById('admin-auth-password').value = '';
                renderApp();
            } else {
                alert('Incorrect administrator password.');
            }
        }

        function adminLogout() {
            state.isAdminLoggedIn = false;
            renderApp();
        }

        function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); document.getElementById('upload-form').reset(); updateLivePricingPreview(); }

        function updateLivePricingPreview() {
            const val = document.getElementById('up-baseprice').value;
            const res = calculatePricing(val);
            document.getElementById('preview-base').innerText = `UGX ${res.basePrice.toLocaleString()}`;
            document.getElementById('preview-markup').innerText = `+ UGX ${res.markup.toLocaleString()}`;
            document.getElementById('preview-customer').innerText = `UGX ${res.customerPrice.toLocaleString()}`;
        }

        let lightboxImages = [];
        let lightboxCurrentIndex = 0;

        function openLightbox(productIndexOrId) {
            const item = state.products.find(p => p.id === productIndexOrId);
            if (!item || !item.images || item.images.length === 0) return;
            lightboxImages = item.images;
            lightboxCurrentIndex = 0;
            updateLightboxDisplay();
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function updateLightboxDisplay() {
            document.getElementById('lightbox-img').src = lightboxImages[lightboxCurrentIndex];
            document.getElementById('lightbox-counter').innerText = `${lightboxCurrentIndex + 1} / ${lightboxImages.length}`;
            document.getElementById('lightbox-controls').classList.toggle('hidden', lightboxImages.length <= 1);
        }

        function nextLightboxImage() { lightboxCurrentIndex = (lightboxCurrentIndex + 1) % lightboxImages.length; updateLightboxDisplay(); }
        function prevLightboxImage() { lightboxCurrentIndex = (lightboxCurrentIndex - 1 + lightboxImages.length) % lightboxImages.length; updateLightboxDisplay(); }
        function closeLightbox() { document.getElementById('lightbox-modal').classList.add('hidden'); lightboxImages = []; }

        function handleCustomerSearch() { renderCustomerGrid(); }

        function renderCustomerGrid() {
            const searchVal = document.getElementById('customer-search-input').value.toLowerCase().trim();
            const categoryVal = document.getElementById('customer-category-filter').value;

            const filteredProducts = state.products.filter(item => {
                return item.name.toLowerCase().includes(searchVal) && (categoryVal === 'All' || item.category === categoryVal);
            });

            document.getElementById('customer-product-grid').innerHTML = filteredProducts.length > 0 ? filteredProducts.map(item => `
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <div class="h-48 bg-slate-100 overflow-hidden relative cursor-pointer" onclick="openLightbox(${item.id})">
                        <img src="${item.images[0]}" alt="${item.name}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-slate-900/80 text-white text-xs px-2.5 py-1 rounded-full">${item.category}</span>
                        ${item.images.length > 1 ? `<span class="absolute bottom-2 left-2 bg-slate-950/80 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-md">📷 ${item.images.length} Photos</span>` : ''}
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-lg text-slate-900 mb-1">${item.name}</h3>
                            <p class="text-xs text-slate-500 mb-3">Guaranteed by Joha Logistics</p>
                        </div>
                        <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-100">
                            <div>
                                <span class="text-xs text-slate-400 block">Price</span>
                                <span class="text-lg font-black text-slate-900">UGX ${item.customerPrice.toLocaleString()}</span>
                            </div>
                            <button onclick="openCheckoutModal(${item.id})" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer">Buy Now</button>
                        </div>
                    </div>
                </div>
            `).join('') : `<p class="text-xs text-slate-400 col-span-full text-center py-8">No products found.</p>`;
        }

        function renderApp() {
            renderCustomerGrid();

            const authContainer = document.getElementById('vendor-auth-container');
            const dashboardContainer = document.getElementById('vendor-dashboard-container');

            if (state.isVendorLoggedIn) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                document.getElementById('vendor-welcome-heading').innerText = `Welcome, ${state.currentVendor.name}`;

                const vendorOrders = state.orders.filter(o => o.vendorName === state.currentVendor.name);
                document.getElementById('vendor-orders-table').innerHTML = vendorOrders.length > 0 ? vendorOrders.map(o => `
                    <tr>
                        <td class="p-3 font-semibold text-slate-900">${o.productName}</td>
                        <td class="p-3 font-medium text-emerald-600">UGX ${o.basePrice.toLocaleString()}</td>
                        <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-800' : o.status === 'Failed' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'}">${o.status}</span></td>
                    </tr>
                `).join('') : `<tr><td colspan="3" class="p-4 text-center text-slate-400 text-xs">No incoming sales yet.</td></tr>`;

                const vendorInventory = state.products.filter(p => p.vendorName === state.currentVendor.name);
                document.getElementById('vendor-inventory-grid').innerHTML = vendorInventory.length > 0 ? vendorInventory.map(item => `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col justify-between space-y-3">
                        <div class="flex space-x-3 items-center">
                            <img src="${item.images[0]}" alt="${item.name}" onclick="openLightbox(${item.id})" class="w-16 h-16 object-cover rounded-lg border border-slate-200 cursor-pointer">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-sm text-slate-900 truncate">${item.name}</h4>
                                <p class="text-xs text-slate-500">${item.category}</p>
                                <p class="text-xs font-black text-amber-600 mt-1">Base: UGX ${item.basePrice.toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-slate-200 flex justify-end">
                            <button onclick="deleteVendorProduct(${item.id})" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">Remove</button>
                        </div>
                    </div>
                `).join('') : `<p class="text-xs text-slate-400 col-span-full">You have not uploaded any items yet.</p>`;
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }

            const adminAuthContainer = document.getElementById('admin-auth-container');
            const adminDashboardContainer = document.getElementById('admin-dashboard-container');

            if (state.isAdminLoggedIn) {
                adminAuthContainer.classList.add('hidden');
                adminDashboardContainer.classList.remove('hidden');

                document.getElementById('admin-markup').innerText = `UGX ${state.markupData.totalMarkup.toLocaleString()}`;
                document.getElementById('admin-count').innerText = state.orders.length;

                document.getElementById('admin-orders-grid').innerHTML = state.orders.length > 0 ? state.orders.map(o => `
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4 flex flex-col justify-between">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                            <div>
                                <span class="text-xs font-black text-slate-900 bg-slate-100 px-2.5 py-1 rounded">${o.id}</span>
                                <h4 class="font-bold text-base text-slate-900 mt-2">${o.productName}</h4>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-800' : o.status === 'Failed' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'}">${o.status}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-xs">
                            <div class="space-y-1">
                                <p class="text-slate-400 font-bold uppercase">Customer Details</p>
                                <p class="font-semibold text-slate-800">${o.customerName}</p>
                                <p class="text-slate-600">📞 ${o.phone}</p>
                                <p class="text-slate-600">📍 ${o.address}</p>
                            </div>
                            <div class="space-y-1">
                                <p class="text-slate-400 font-bold uppercase">Vendor & Payment</p>
                                <p class="font-semibold text-slate-800">${o.vendorName}</p>
                                <p class="text-slate-600">📞 ${o.vendorPhone}</p>
                                <p class="text-slate-600 font-medium">💳 ${o.paymentMethod}</p>
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                            <div><span class="text-slate-400">Total:</span><span class="font-black text-slate-900 ml-1">UGX ${o.total.toLocaleString()}</span></div>
                            <div class="flex space-x-2">
                                <button onclick="updateOrderStatus('${o.id}', 'Failed')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3 py-1.5 rounded-lg transition cursor-pointer">Cancel</button>
                                <button onclick="updateOrderStatus('${o.id}', 'Delivered')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg transition shadow-sm cursor-pointer">Confirm</button>
                            </div>
                        </div>
                    </div>
                `).join('') : `<p class="text-xs text-slate-400 col-span-full text-center py-4">No orders in pipeline.</p>`;
            } else {
                adminAuthContainer.classList.remove('hidden');
                adminDashboardContainer.classList.add('hidden');
            }
        }

        async function handleProductUpload(e) {
            e.preventDefault();
            const name = document.getElementById('up-name').value;
            const category = document.getElementById('up-category').value;
            const imageInputFiles = document.getElementById('up-images').files;
            const basePriceInput = document.getElementById('up-baseprice').value;

            if (imageInputFiles.length === 0) { alert('Select at least one local image.'); return; }

            const imagePromises = Array.from(imageInputFiles).map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            });

            const uploadedImageUrls = await Promise.all(imagePromises);
            const pricing = calculatePricing(basePriceInput);

            const newProduct = {
                id: Date.now(),
                name,
                category,
                images: uploadedImageUrls,
                basePrice: pricing.basePrice,
                customerPrice: pricing.customerPrice,
                markup: pricing.markup,
                vendorName: state.currentVendor.name,
                vendorPhone: state.currentVendor.phone,
                location: 'Kampala'
            };

            await _supabase.from('products').insert([newProduct]);
            closeUploadModal();
            alert('Product successfully published live!');
            fetchAllDataFromCloud();
        }

        function openCheckoutModal(productId) {
            state.selectedProduct = state.products.find(p => p.id === productId);
            document.getElementById('modal-item-name').innerText = state.selectedProject.name;
            document.getElementById('modal-item-price').innerText = `Total: UGX ${state.selectedProduct.customerPrice.toLocaleString()}`;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); state.selectedProduct = null; }

        async function handleCheckoutSubmit(e) {
            e.preventDefault();
            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                productName: state.selectedProduct.name,
                customerName: document.getElementById('chk-name').value,
                phone: document.getElementById('chk-phone').value,
                address: document.getElementById('chk-address').value,
                paymentMethod: document.getElementById('chk-payment').value,
                status: 'Pending',
                total: state.selectedProduct.customerPrice,
                basePrice: state.selectedProduct.basePrice,
                markup: state.selectedProduct.markup,
                vendorName: state.selectedProduct.vendorName,
                vendorPhone: state.selectedProduct.vendorPhone
            };

            await _supabase.from('orders').insert([newOrder]);
            closeCheckoutModal();
            alert('Order successfully placed!');
            fetchAllDataFromCloud();
        }

        async function updateOrderStatus(orderId, newStatus) {
            const order = state.orders.find(o => o.id === orderId);
            if (order && order.status !== newStatus) {
                if (newStatus === 'Delivered') {
                    state.markupData.totalMarkup += order.markup;
                    await _supabase.from('system_state').update({ totalMarkup: state.markupData.totalMarkup }).eq('id', 'global');
                    alert(`Order confirmed! UGX ${order.markup.toLocaleString()} added to net markup earnings.`);
                }
                await _supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
                fetchAllDataFromCloud();
            }
        }

        // Initialize App on Load
        fetchAllDataFromCloud();
        setupRealtimeSync();
    </script>
